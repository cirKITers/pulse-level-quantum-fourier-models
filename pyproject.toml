[project]
name = "pulse-level-qfms"
version = "0.1.0"
description = "Pulse-level quantum Fourier models: expressivity, spectra and trainability."
authors = [
    { name = "Melvin Strobl", email = "lc3267@kit.edu" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax>=0.9.0.1",
    "optax>=0.2.7",
    "numpy>=2.0.0",
    "scipy>=1.17.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "rich>=14.2.0",
    "plotly>=6.5.0",
    "kaleido>=1.2.0",
    "qml-essentials>=0.3.1",
    "jaqsi>=0.1.1",
    "fluksio>=0.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulse_level_qfms"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6.3.0",
    "ruff>=0.12",
    "ipykernel>=7.1.0",
    "marimo>=0.19.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]
