[project]
name = "pulse-level-qfms"
version = "0.1.0"
description = "Pulse-level quantum Fourier models: expressivity, spectra and trainability."
authors = [
    { name = "Melvin Strobl", email = "lc3267@kit.edu" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax>=0.9.0.1",
    "optax>=0.2.7",
    "numpy>=2.0.0",
    "scipy>=1.17.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "rich>=14.2.0",
    "plotly>=6.5.0",
    "kaleido>=1.2.0",
    "qml-essentials",
    "jaqsi",
    "fluksio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulse_level_qfms"]

[tool.uv.sources]
qml-essentials = { git = "https://github.com/cirKITers/qml-essentials", rev = "424e35a7c693c7107ce3934140c45f41ce29574c" }
jaqsi = { git = "https://github.com/cirKITers/jaqsi", rev = "99ebc1406eff447d0247ea2f0e12895658569d75" }
fluksio = { git = "https://git.stroblme.de/Fluksio/app", rev = "dafdcb76c4b4d04bc3f217c46228a5bcb3f63c40", subdirectory = "backend" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6.3.0",
    "ruff>=0.12",
    "ipykernel>=7.1.0",
    "marimo>=0.19.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W"]
