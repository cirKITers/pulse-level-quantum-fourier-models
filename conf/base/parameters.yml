seed: 1000

data:
  seed: 1000
  domain: [0, 6.283185307] # domain of x values
  coefficients_max: 1.0
  coefficients_min: 0.0
  batch_size: -1
  zero_centered: True
  # domain oversampling, mirroring spectrum.mts / spectrum.mfs
  mts: 4
  mfs: 1
  # target frequencies that do not align with the model's own comb.
  # "none" keeps the model comb, "index" displaces each component
  # independently (arbitrary, generally not reachable), "generator" displaces
  # the per-gate generators (reachable by an encoding pulse configuration)
  offgrid_mode: "generator"
  # likelihood that a single component (or generator) is displaced
  offgrid_prob: 1.0
  # offsets are multiples of 1/resolution. keep it a power of two for exact frequencies
  offgrid_resolution: 2

model:
  seed: 1000
  n_qubits: 3
  n_layers: 2
  circuit_type: "Circuit_3" # Hardware_Efficient Circuit_15 Circuit_17 Circuit_19
  data_reupload: True
  encoding_gates: ["RY"]
  encoding_strategy: "ternary" # hamming (default), binary, ternary
  output_qubit: -1
  initialization: "random"
  initialization_domain: [0, 6.283185307179586]
  decompose_circuit: False
  envelope: "gaussian"
  rwa: True
  frame: "drive" # ignored when rwa=True
  noise_params:
    BitFlip: 0.0
    PhaseFlip: 0.0
    AmplitudeDamping: 0.0
    PhaseDamping: 0.0
    Depolarizing: 0.0

train:
  steps: 2000
  learning_rate: 1e-3
  pulse_learning_rate: 1e-3
  batch_size: -1
  loss_functions: ["mse"]
  loss_scalers: [1.0]
  # must be "unitary" when decompose_circuit is true
  # "unitary" | "ansatz_pulse" | "enc_pulse" | "all_pulse"
  gate_mode: "enc_pulse"
  # "ones" starts the encoding scalers at identity; "target" oracle-initializes
  # the amplitude scalers at the etas that make the off-grid comb reachable
  # (offgrid_mode="generator" only), to separate reachability from optimization
  enc_pulse_init: "ones"
  train_enc_params: False
  rank_eval:
    enabled: True
    tol_rel: 1.0e-8
    report_interval: 50

landscape:
  # bounds of the encoding scaler axis. eta=1 is the initial (calibrated)
  # configuration, the target scalers are within [1-1/r, 1+1/r]
  eta_min: 0.0
  eta_max: 2.0
  # samples per loss oscillation. the oscillation period along eta is
  # 1/(data.mts * generator), so the grid gets finer with the generator
  points_per_period: 20
  # encoding scalers per pulse-backend model call
  chunk: 64

fcc:
  seed: 1000
  n_samples: 500
  # subset of "unitary" | "pulse" | "enc_pulse", matched exactly.
  # the pulse entries also select the regime the coefficients are computed in:
  # neither -> unitary, "pulse" -> ansatz_pulse, "enc_pulse" -> enc_pulse,
  # both -> all_pulse
  sample_axis: ["unitary", "pulse"]
  pulse_params_variance: 0.008
  method: "pearson"
  weighting: False
  scale: True
  numerical_cap: 1e-10

spectrum:
  seed: 1000
  n_samples: 500
  # subset of "unitary" | "pulse" | "enc_pulse", matched exactly
  # "enc_pulse" selects the enc_pulse regime, i.e. the ansatz runs as a
  # unitary while only the encoding gates run at pulse level
  sample_axis: ["unitary", "enc_pulse"]
  pulse_params_variance: 0.008
  scale: True
  # frequency oversampling. mts sets the bin spacing to 1/mts, which is what
  # makes a frequency shift resolvable at all. Keep it a power of two so the
  # frequency values, and with them the metric names, stay exact.
  # mfs must be at least the largest amplitude scaler when analyzing trained
  # enc_pulse models (mfs=1 is valid here because the variance keeps eta near 1)
  mfs: 1
  mts: 4

fidelity:
  seed: 1000
  n_samples: 500
  pulse_params_variance: 0.008
  scale: True

expressibility:
  seed: 1000
  n_samples: 500
  n_bins: 50
  sample_axis: ["unitary", "pulse"]
  pulse_params_variance: 0.008
  scale: True
